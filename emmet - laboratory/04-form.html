<input type="text" name="" id="">
<input type="email" name="" id="">
<input type="password" name="" id="">
<input type="checkbox" name="" id="">
<input type="radio" name="" id="">
<input type="submit" value="">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Student Registration Form</h2>
    
    <form action="#" method="POST">
        <div>
            <label for="student_id">Student ID:</label><br>
            <input type="text" id="student_id" name="student_id" required>
        </div>
        <br>

        <div>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required>
        </div>
        <br>

        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
        </div>
        <br>

        <div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required>
        </div>
        <br>

        <div>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </div>
        <br>

        <div>
            <label for="course">Course:</label><br>
            <select id="course" name="course" required>
                <option value="" disabled selected>Select your course</option>
                <option value="bsit">BS Information Technology</option>
                <option value="bscs">BS Computer Science</option>
                <option value="bscpe">BS Computer Engineering</option>
                <option value="bsba">BS Business Administration</option>
            </select>
        </div>
        <br>

        <div>
            <label>Hobbies:</label><br>
            <input type="checkbox" id="hobby1" name="hobbies" value="Reading">
            <label for="hobby1">Reading</label>
            <input type="checkbox" id="hobby2" name="hobbies" value="Sports">
            <label for="hobby2">Sports</label>
            <input type="checkbox" id="hobby3" name="hobbies" value="Coding">
            <label for="hobby3">Coding</label>
            <input type="checkbox" id="hobby4" name="hobbies" value="Gaming">
            <label for="hobby4">Gaming</label>
        </div>
        <br>

        <div>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="30" required></textarea>
        </div>
        <br>

        <div>
            <input type="submit" value="Submit">
        </div>
    </form>

</body>
</html>
