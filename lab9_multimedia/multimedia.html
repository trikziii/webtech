<!DOCTYPE html>
<html lang="en">
<head>
    <title>Multimedia</title>
</head>

<body>
    <h1>Multimedia Elements</h1>
    
    <section>
        <h2>Image</h2>
        <img src="dino1.jpeg" alt="A Brachiosaurus" width="200">
    </section>

    <section>
        <h2>Audio</h2>
        <audio controls>
            <source src="brachiosaurus_sound.mp3" type="audio/mp3">
        </audio>
    </section>

    <section>
        <h2>Video</h2>
        <video controls width="400">
            <source src="brachiosaurus_video.mp4" type="video/mp4">
        </video>
    </section>

    <section>
        <h2>Embedded Educational Video</h2>
        <iframe width="800" height="400" src="https://www.youtube.com/embed/4z3-kM7gvA0" title="Brachiosaurus Facts for Kids | All about the Brachiosaurus!" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>
</body>
</html>
