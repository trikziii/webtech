<!DOCTYPE html>
<html lang = "en">
<head>
    <title>Student Registration Form</title>
</head>

<body>
    <h1>Student Registration Form</h1>

    <form action="#" method="post">
        <div>
            <label for = "fullname">Full Name: </label>
            <input type="text" id="fullname" placeholder="Enter your full name" required minlength="2" maxlength="50">
        </div>
        <br>

        <div>
            <label for = "studentid">Student ID: </label>
            <input type="text" id="studentid" name="studentid" placeholder="e.g., 21-1234-567" required maxlength="9">
        </div>
        <br>

        <div>
            <label for = "email"> Email: </label>
            <input type="email" id="email" name="email" placeholder="student@example.com" required>
        </div>

        <div>
            <label for = "password"> Password: </label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8">
        </div>
        <br>

        <div>
            <label for="birthday"> Birthday: </label>
            <input type="date" id="birthday" name="birthday" required>
        </div>
        <br>

        <div>
            <label>Gender: </label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other"> Other </label>
        </div>
        <br>

        <div>
            <label for="program">Program: </label>
            <select id="program" name="program" required>
                <option value="">--Select Program</option>
                <option value="cs">Computer Science</option>
                <option value="it">Information Technology</option>
                <option value="eng">Engineering</option>
                <option value="educ">Education</option>
            </select>
        </div>
        <br>

        <div>
            <label>Hobbies:</label>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label>

            <input type="checkbox" id="sports" name="hobbies" value="sports">
            <label for="sports">Sports</label>

            <input type="checkbox" id="coding" name="hobbies" value="coding">
            <label for="coding">Coding</label>
        </div>
        <br>

        <div>
            <label for="address">Address: </label>
            <textarea id="address" name="address" placeholder="Enter your full address" rows="3" required></textarea>
        </div>
        <br>

        <div>
            <label for="comments">Comments: </label>
            <textarea id="comments" name="comments" placeholder="Any additional comments or notes" rows="3"></textarea>
        </div>
        <br>

        <div>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>
    </form>
</body>
</html>
