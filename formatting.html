<!DOCTYPE html>
<html>
    <head>
        <title>HTML Text Formatting</title>
    </head>

    <body>
        <p>
            This text is <b>bold</b>
        </p>
        <p>
            This text is <strong>important!</strong>
        </p>
        <p>
            This text is <i>italic</i>
        </p>
        <p>
            This text is <em>emphasized</em>
        </p>
        <p>
            This is a <u>mi$peldt</u> text.
        </p>
        <p>
            Don't forget to buy <mark>milk</mark>
        </p>
        <p>
            <small>The text is too small, I can't see.</small>
        </p>
        <p>
            I <del>love</del> hate math.
        </p>
        <p>
            I <del>love</del> <ins>hate</ins> math.
        </p>
        <p>
            This is <sub>subscripted</sub> text.
        </p>
        <p>
            This is <sup>superscripted</sup> text.
        </p>

        <h1> Challenge </h1>
        <p>H<sub>2</sub>0</p>
        <p>E=mc<sup>2</sup></p>
    </body>
</html>
